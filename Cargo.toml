[workspace]
resolver = "2"
members = [
    "crates/localpad-cli",
    "crates/localpad-core",
    "crates/localpad-server",
    "crates/localpad-output-dsu",
    "crates/localpad-output-linux",
    "crates/localpad-output-macos",
    "crates/localpad-output-windows",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lewisjohnvillamor/Local-Pad"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
