[package]
name = "localpad-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
localpad-core = { path = "../localpad-core" }
localpad-output-dsu = { path = "../localpad-output-dsu" }
localpad-output-linux = { path = "../localpad-output-linux" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
rand.workspace = true
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = "0.5"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
mdns-sd = "0.13"
qrcode = "0.14"
local-ip-address = "0.6"
sha2 = "0.10"
data-encoding = "2"
directories = "6"

[target.'cfg(target_os = "macos")'.dependencies]
localpad-output-macos = { path = "../localpad-output-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
localpad-output-windows = { path = "../localpad-output-windows" }

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util = "0.3"
